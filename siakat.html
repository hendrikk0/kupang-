        .div_loading {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 999;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal#modalCaptcha .modal-dialog {
            max-width: 460px;
        }

        .modal#modalCaptcha .modal-header {
            display: flex;
            align-items: baseline;
        }

        .modal#modalCaptcha .modal-header .modal-title {
            flex-grow: 1;
        }

        @keyframes shake{
            0%,100%{ transform:translateX(0)}
            15% {transform:translateX(-6px)}
            30%{transform:translateX(6px)}
            45%{transform:translateX(-4px)}
            60%{transform:translateX(4px)}
            75%{transform:translateX(-2px)}
            90%{transform:translateX(2px)}
        }

        .shake{
            animation:shake .5s ease;
        }

        .modal-shake {
            animation: shake 0.2s ease-in-out 2;
        }

        #captcha {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            overflow: hidden;
            border-radius: 8px;
        }

        #captcha::before {
            content: "";
            position: absolute;
            inset: 0;

            background: rgba(18, 18, 18, 0.20);
            backdrop-filter: blur(20px);

            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 25;
        }

        #captcha .empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 20px;
            background: #DDD;
            height: 100%;
        }

        #captcha .empty-state p {
            color: rgba(0, 0, 0, 0.50);
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            line-height: 22px;
        }

        #captcha-success {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 8px;
        }

        #captcha-success i {
            font-size: 48px;
            color: #4CB782;
        }

        #captcha-success span {
            color: #FFF;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }

        #captcha-error {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.60);
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 8px;
        }

        #captcha-error i {
            font-size: 48px;
            color: #ef4444;
        }

        #captcha-error span {
            color: #FFF;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            padding: 0 16px;
        }

        #captcha.is-loading::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(18, 18, 18, 0.20);
            opacity: 1;
            transition: opacity 0.2s ease;
            z-index: 25;
        }

        #captcha .loading-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease;
            z-index: 30;
        }

        #captcha.is-loading .loading-content {
            opacity: 1;
            visibility: visible;
            display: flex;
            animation: fadeIn 0.2s ease forwards;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 5px solid #ddd;
            border-top: 5px solid #004680;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        #slider-track.is-retry {
            background: #004680;
            cursor: pointer;
        }

        #slider-track.is-retry #slider-fill {
            position: unset;
        }
        
        #slider-track.is-retry #slider-label {
            color: #fff;
            padding-left: 0;
            gap: 6px;
        }
        #slider-track.is-retry #slider-thumb {
            display: none;
        }
        #slider-track.is-retry #sliderInput {
            display: none;
        }

        #sliderInputContainer {
            width: 100%;
            max-width: 420px;
            border-radius: 8px;
            background: #f2f2f2;
            padding: 10px;
            margin: 10px auto;
        }

        #slider-track {
            position: relative;
            width: 100%;
            height: 46px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.02);
            background: rgba(0, 0, 0, 0.08);
            padding: 12px 24px;
            display: flex;
            align-items: center;
        }
        
        #slider-fill {
            position: absolute;
            inset-block: 2px;
            left: 1.5px;
            width: 0;               
            background: rgba(0, 0, 0, 0.12);
            border-radius: 8px;
            pointer-events: none;
        }
        
        #slider-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-left: 56px;         
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            color: rgba(0, 0, 0, 0.5);
            font-size: 12px;
            font-weight: 400;
            line-height: 18px;
        }
        
        #sliderInput {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: grab;
            margin: 0;
            z-index: 5;
            height: 46px;
        }
        
        #slider-thumb {
            position: absolute;
            left: 1.5px;
            top: 1.5px;
            width: 42px;
            height: 42px;
            background: #004680;
            border: 0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 6;
            box-shadow: 0 0 16px 0 #5B8DC0;
            transition: background 0.3s ease;
        }
        
        #slider-thumb span {
            font-size: 16px;
            color: #fff;    
        }
        #slider-thumb.is-success {
            background: #4AB781;
            box-shadow: 0 0 16px 0 rgba(74, 183, 129, 0.50);
        }
        #slider-track.is-success {
            outline: 1.5px solid #4AB781;
        }
        #slider-thumb.is-error {
            background: #999;
            box-shadow: 0 0 16px 0 #999;
            pointer-events: none;
            cursor: no-drop;
        }
        #slider-track.is-error {
            animation: shake 0.4s ease;
            outline: 1.5px solid #ef4444;
        }
        #captcha #bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            user-select: none;
        }

        #slider {
            position: absolute;
            border: none;
            box-shadow: none;
            filter: drop-shadow(1px 0 0 rgba(255, 255, 255, 0.9))
                    drop-shadow(-1px 0 0 rgba(255, 255, 255, 0.9))
                    drop-shadow(0 1px 0 rgba(255, 255, 255, 0.9))
                    drop-shadow(0 -1px 0 rgba(255, 255, 255, 0.9))
                    drop-shadow(0 4px 8px rgba(0, 0, 0, 0.45));
            top: 50px;
            pointer-events: none;
            z-index: 10;
        }
        #bg, #slider {
            opacity: 1;
        }
        #bg[src],
        #slider[src] {
            animation: fadeImageIn 0.4s ease;
        }

        @keyframes fadeImageIn {
            from {
                opacity: 0;
                transform: scale(1.02);
                filter: blur(6px);
            }
            to {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }
    </style>

    <script type="text/javascript">
        function showPass() {
            if (document.getElementById("password").type == 'password') {
                document.getElementById("password").type = 'text';
                document.getElementById("iconshow").classList.remove('fa-eye-slash');
                document.getElementById("iconshow").classList.add('fa-eye');
            } else {
                document.getElementById("password").type = 'password';
                document.getElementById("iconshow").classList.remove('fa-eye');
                document.getElementById("iconshow").classList.add('fa-eye-slash');
            }
        }

        $('[data-type="login"]').click(function() {
            var formlogin = $(this).parents("form:eq(0)");
                            formlogin.submit();
                    });

        // cek login
        $(function() {
            $('#email').keypress(function(e) {
                // Enter pressed?
                if (e.which == 10 || e.which == 13) {
                    $('[data-type="login"]').trigger('click');
                }
            });
            $('#password').keypress(function(e) {
                // Enter pressed?
                if (e.which == 10 || e.which == 13) {
                    $('[data-type="login"]').trigger('click');
                }
            });
        });
    </script>
